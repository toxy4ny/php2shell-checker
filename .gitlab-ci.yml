# GitLab is currently a mirror; GitHub Actions is the source of CI results.
# Remove this workflow rule to re-enable GitLab CI when it is needed.
workflow:
  rules:
    - when: never

stages: [test]
variables:
  DEBIAN_FRONTEND: noninteractive
debian:
  stage: test
  image: debian:${RELEASE}-slim
  parallel:
    matrix:
      - RELEASE: [bookworm, trixie]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 php-cli
  script:
    - python3 -m unittest discover -s tests -v
    - python3 tests/smoke.py
